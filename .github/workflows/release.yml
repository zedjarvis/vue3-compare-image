name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to release (e.g. v1.2.6)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  changelog:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout selected tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --force --tags
          git checkout "refs/tags/${{ github.event.inputs.tag }}"

      - name: Generate release notes
        run: npx changelogithub@14
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    needs: changelog
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout selected tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --force --tags
          git checkout "refs/tags/${{ github.event.inputs.tag }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify quality gates
        run: pnpm check

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: pnpm publish --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
