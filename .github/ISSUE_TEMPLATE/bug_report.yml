name: Bug report
description: Report a reproducible bug.
title: 'bug: '
labels:
  - bug
body:
  - type: textarea
    id: current
    attributes:
      label: Current behavior
      description: What is happening now?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps and minimal reproduction repository or stackblitz link.
      placeholder: |
        1. Install ...
        2. Render component with ...
        3. Trigger ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 1.2.5
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Vue 3.5.x, Vite 7.x, Chrome 123...
